# 彩球连珠 · 打点日志格式
# 放到 ECS：/etc/nginx/conf.d/color-lines-log.conf
#
# log_format 只能定义在 http 上下文里（写进 server 块 nginx 会启动失败），
# 而 nginx.conf 的 http 块里已经 include 了 conf.d/*.conf，所以单独搁这儿。
#
# 一行 = 一分钟真实游戏时间。字段：本地时间 / 匿名ID / 会话ID
# 刻意不记 $remote_addr 和 $http_user_agent —— 统计玩了多久用不上，别留。
log_format color_lines_play '$time_iso8601 $arg_u $arg_s';
