# lines.knowyourself.com.cn —— 彩球连珠（独立子域名，不碰现有站点配置）
# 放到 ECS：/etc/nginx/sites-available/color-lines.conf
# 再软链：ln -s /etc/nginx/sites-available/color-lines.conf /etc/nginx/sites-enabled/
# 先用 HTTP（80）跑通，再 certbot --nginx 自动补 443 + 跳转。
#
# 注：服务器上的实际配置已被 certbot 改写（补了 443 块和 80→443 跳转），
# 本文件是原始模板 + 打点/统计两段，改服务器时对照着加即可。
server {
    listen 80;
    listen [::]:80;
    server_name lines.knowyourself.com.cn;   # ← 改成你要用的子域名

    root /var/www/color-lines;   # git clone 的仓库根，index.html 在这里
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 匿名打点：只在专用日志里记一行，不落任何文件，直接 204 走人。
    # 日志格式 color_lines_play 定义在 conf.d/color-lines-log.conf。
    location = /px {
        access_log /var/log/nginx/color-lines-play.log color_lines_play;
        return 204;
    }

    # 游玩统计页，内容由 cron 每 10 分钟跑 color_lines_stats.sh 生成。
    #
    # 必须用 ^~：否则内部跳转到 /stats/index.html 时会被下面那条 .html 正则
    # location 抢走（regex 优先于普通前缀），结果拿 root 去找、404。
    # ^~ 命中后 nginx 就不再试正则了，所以 no-cache 头也得在这儿自己加。
    location ^~ /stats/ {
        alias /var/www/color-lines-stats/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # 代码体积很小、更新后文件名不变，关掉强缓存，保证 git pull 后立即生效
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
